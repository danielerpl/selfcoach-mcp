[project]
name = "selfcoach-mcp"
version = "0.3.0"
description = "Self-coaching for Garmin athletes: an MCP server that gives daily readiness advice, pushes structured workouts to your Garmin watch and finds insights Garmin does not show"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniele Rapali" }]
requires-python = ">=3.12"
keywords = ["garmin", "garmin-connect", "mcp", "model-context-protocol", "claude", "training", "fitness", "coach"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "garminconnect>=0.3.17",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.1.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.6"]
supabase = ["psycopg[binary]>=3.3.6"]

[project.urls]
Homepage = "https://github.com/danielerpl/selfcoach-mcp"
Issues = "https://github.com/danielerpl/selfcoach-mcp/issues"

[project.scripts]
selfcoach-mcp = "selfcoach_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfcoach_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
